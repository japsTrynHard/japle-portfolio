<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Japle Ligaya: full-stack web and mobile developer seeking a software development internship. Explore Flutter and React projects, technical skills, and individual contributions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Japle Ligaya — Full-Stack Web & Mobile Developer" />
    <meta
      property="og:description"
      content="Explore the web and mobile applications, technical skills, and project contributions of Japle A. Ligaya."
    />
    <meta property="og:image" content="/images/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <title>Japle Ligaya — Full-Stack Web & Mobile Developer</title>
    <script>
      var resolvedTheme = 'light'
      try {
        var t =
          localStorage.getItem('japle-theme-revision') === 'nba-light-v1'
            ? localStorage.getItem('japle-theme')
            : 'light'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          resolvedTheme = 'dark'
      } catch (e) {}
      document.documentElement.dataset.theme = resolvedTheme
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', resolvedTheme === 'dark' ? '#18191a' : '#f8fafc')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
